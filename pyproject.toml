[project]
name = "sustainable-ai-carbonfootprint"
version = "0.1.0"
description = "Carbon footprint van AI-gebruik meten via chat exports"
requires-python = ">=3.12"
dependencies = [
    "ecologits>=0.10.2,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "tiktoken>=0.9",
]

[project.scripts]
co2chat = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/bulk_analyser",
    "src/carbon_calculator",
    "src/cli",
    "src/structuur_detectie",
]

[tool.hatch.build.targets.wheel.force-include]
"src/carbon_calculator/data" = "carbon_calculator/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# context/ bevat echte chat exports met niet-gerelateerde Python bestanden
extend-exclude = ["context"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "SIM", "UP", "W"]
# N818: bewust Nederlandse uitzonderingnaam 'ParseFout'
ignore = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["bulk_analyser", "carbon_calculator", "cli", "structuur_detectie"]

[tool.mypy]
python_version = "3.12"
strict = true
# context/ bevat echte chat exports met niet-gerelateerde Python bestanden
exclude = ["^context/"]
